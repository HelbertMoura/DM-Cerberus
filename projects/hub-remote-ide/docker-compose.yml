# =============================================================
# Dev Maniac's Hub — Docker Compose (Fase 1)
# Stack: code-server (VSCode web) + postgres (audit log) + caddy
# Subir: docker compose up -d
# Logs: docker compose logs -f code-server
# =============================================================

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hub_dm
      POSTGRES_USER: hub_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - hub-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_admin -d hub_dm"]
      interval: 30s
      timeout: 10s
      retries: 5
    # NÃO expor porta — acesso só via network interna

  code-server:
    image: linuxserver/code-server:latest
    container_name: hub-code-server
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Sao_Paulo
      DEFAULT_WORKSPACE: /config/workspace
      PASSWORD: ${CODE_PASSWORD:?Set CODE_PASSWORD in .env}
      SUDO_PASSWORD: ${CODE_PASSWORD:?Set CODE_PASSWORD in .env}
    volumes:
      - ./code-server/config:/config
      - ./code-server/workspace:/config/workspace
      - /opt/sistemas:/opt/sistemas:rw   # acesso aos seus projetos
    networks:
      - hub-net
    depends_on:
      postgres:
        condition: service_healthy
    # NÃO expor porta direto — Caddy faz proxy

  caddy:
    image: caddy:2-alpine
    container_name: hub-caddy
    restart: unless-stopped
    ports:
      - "8766:8080"  # Cloudflare tunnel aponta pra cá
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - hub-net
    depends_on:
      - code-server

networks:
  hub-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
