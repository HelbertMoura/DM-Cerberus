<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#061637">
  <link rel="icon" href="/assets/brand/dev-maniacs-mark-180.png" type="image/png">
  <title>Sem conexão · Hub DM</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #061637;
      color: #faf6ed;
      font-family: system-ui, -apple-system, Arial, sans-serif;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      max-width: 420px;
      border: 3px solid #08b9ca;
      box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.45);
      padding: 36px 28px;
      background: #0b1f4b;
    }
    img { width: 72px; height: 72px; image-rendering: pixelated; }
    .eyebrow {
      font-family: Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.18em;
      color: #6b4c9a;
      text-transform: uppercase;
      margin-top: 16px;
    }
    h1 { font-size: 22px; margin: 8px 0 12px; }
    p { margin: 8px 0; line-height: 1.55; color: #c9d4ef; font-size: 15px; }
    .stripe { display: flex; gap: 2px; height: 6px; margin: 18px 0; }
    .stripe i { flex: 1; }
    .stripe i:nth-child(1) { background: #ff4c4c; }
    .stripe i:nth-child(2) { background: #ffd166; }
    .stripe i:nth-child(3) { background: #08b9ca; }
    .stripe i:nth-child(4) { background: #6b4c9a; }
    button {
      min-height: 48px;
      padding: 0 24px;
      margin-top: 12px;
      background: #08b9ca;
      color: #061637;
      border: 0;
      border-radius: 4px;
      font-family: Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:active { transform: translateY(2px); }
    footer { margin-top: 18px; font-family: Consolas, monospace; font-size: 11px; color: #5c7090; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/brand/dev-maniacs-mark-512.png" alt="Dev Maniac's">
    <p class="eyebrow">DM//OFFLINE</p>
    <h1>Sem conexão</h1>
    <p>O Hub precisa de internet pra alcançar suas IDEs remotas. Reconecte e tente de novo.</p>
    <div class="stripe"><i></i><i></i><i></i><i></i></div>
    <button onclick="location.reload()">Tentar de novo</button>
    <footer id="status">aguardando rede...</footer>
  </div>
  <script>
    // Volta sozinho quando a rede volta
    const el = document.getElementById('status');
    function up() { el.textContent = 'rede voltou — recarregando...'; setTimeout(() => location.replace('/hub.html'), 600); }
    if (navigator.onLine) up();
    addEventListener('online', up);
    addEventListener('offline', () => { el.textContent = 'sem rede'; });
  </script>
</body>
</html>
