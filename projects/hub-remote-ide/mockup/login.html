<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#061637">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DM Hub">
  <meta name="description" content="Hub remoto de IDEs da Dev Maniac's — Gemini, M3, Z.AI. Acesse de qualquer lugar.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/brand/dev-maniacs-mark.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/brand/dev-maniacs-mark.png">
  <link rel="stylesheet" href="/styles.css">
  <title>Entrar · Hub DM</title>
  <script>
    // Registrar service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[PWA] Service Worker registrado:', reg.scope))
          .catch(err => console.warn('[PWA] Falha ao registrar SW:', err));
      });
    }
  </script>
</head>
<body class="login-page">

  <div class="login-grid">

    <!-- Coluna esquerda: mascote + brand -->
    <aside class="login-aside" aria-label="Dev Maniac's">
      <header class="aside-brand">
        <img src="../assets/brand/dev-maniacs-mark.png" alt="Dev Maniac's" class="brand-mark" width="56" height="56">
        <div class="brand-copy">
          <strong>DEV MANIAC'S</strong>
          <small>HUB REMOTO DE IDEs</small>
        </div>
      </header>

      <div class="aside-mascot">
        <img src="../assets/brand/dev-maniacs-mascot.webp" alt="Helbert Moura, fundador da Dev Maniac's" width="320" height="320">
      </div>

      <footer class="aside-meta">
        <span class="meta-tag">HM//PROFILE</span>
        <span class="meta-status">
          <i class="status-dot"></i>
          ONLINE
        </span>
      </footer>
    </aside>

    <!-- Coluna direita: form -->
    <main class="login-main">

      <div class="login-shell">

        <p class="eyebrow"><span class="eyebrow-bar"></span> ACESSO RESTRITO</p>

        <h1 class="login-title">Hub Remoto de IDEs</h1>
        <p class="login-subtitle">Gerencie Gemini, MiniMax M3 e Z.AI Code de qualquer lugar.</p>

        <!-- Google OAuth (atalho mobile — 1 toque) -->
        <div class="oauth-row">
          <a href="/auth/google" class="btn-google" id="googleLogin" role="button">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span>Entrar com Google</span>
          </a>
        </div>

        <div class="divider"><span>ou use e-mail</span></div>

        <form class="login-form" id="loginForm" novalidate>

          <label class="field">
            <span class="field-label">E-mail</span>
            <input
              type="email"
              id="email"
              name="email"
              class="field-input"
              placeholder="helbertcurcio@gmail.com"
              autocomplete="email"
              required
            >
          </label>

          <label class="field">
            <span class="field-label">Senha</span>
            <div class="field-password">
              <input
                type="password"
                id="password"
                name="password"
                class="field-input"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              >
              <button type="button" class="field-toggle" aria-label="Mostrar senha" id="togglePassword">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </label>

          <div class="form-row">
            <label class="checkbox">
              <input type="checkbox" id="remember" name="remember">
              <span>Lembrar por 30 dias</span>
            </label>
            <a href="#" class="link">Esqueci a senha</a>
          </div>

          <button type="submit" class="btn-primary" id="submitBtn">
            <span>Entrar</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

          <!-- TOTP step (aparece após submit fake) -->
          <div class="totp-step hidden" id="totpStep" aria-live="polite">
            <div class="totp-divider">
              <span>Confirme com 2FA</span>
            </div>
            <label class="field">
              <span class="field-label">
                Código TOTP
                <span class="field-hint">Google Authenticator</span>
              </span>
              <input
                type="text"
                id="totp"
                name="totp"
                class="field-input field-input-mono"
                placeholder="000000"
                maxlength="6"
                pattern="[0-9]{6}"
                autocomplete="one-time-code"
                inputmode="numeric"
              >
            </label>
          </div>

        </form>

        <footer class="login-footer">
          <small class="footer-meta">Mateus Leme · Minas Gerais · Brasil</small>
          <small class="footer-version">DM//HUB v1.0.0 · build 22.08.2026</small>
        </footer>

      </div>

    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
